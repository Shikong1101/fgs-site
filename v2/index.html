<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Fo Guang Shan Genève — Visite interactive</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="v2.css" />
<script>
  // 除錯用：任何 JS 錯誤都顯示在畫面上，不要無聲失敗
  window.addEventListener("error", function (e) {
    var box = document.getElementById("debug-error-box");
    if (!box) {
      box = document.createElement("div");
      box.id = "debug-error-box";
      box.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:9999;background:#b33a3a;color:#fff;padding:12px 16px;font:14px monospace;white-space:pre-wrap;";
      document.body ? document.body.appendChild(box) : document.addEventListener("DOMContentLoaded", function(){ document.body.appendChild(box); });
    }
    box.textContent = "程式發生錯誤：" + e.message + "\n檔案：" + e.filename + " 第 " + e.lineno + " 行";
  });
  window.addEventListener("unhandledrejection", function (e) {
    var box = document.getElementById("debug-error-box");
    if (!box) {
      box = document.createElement("div");
      box.id = "debug-error-box";
      box.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:9999;background:#b33a3a;color:#fff;padding:12px 16px;font:14px monospace;white-space:pre-wrap;";
      document.body.appendChild(box);
    }
    box.textContent = "Promise 錯誤：" + (e.reason && e.reason.message ? e.reason.message : e.reason);
  });
  console.log("[FGS v2] app 版本：2026-07-08-i（拿掉左邊完的手動返回鈕，避免誤點到右邊），如果主控台看得到這行，代表新版檔案有載入。");
</script>
</head>
<body>

<!-- 開場門 -->
<div class="door-intro" id="door-intro">
  <div class="door-intro__inner">
    <p class="door-intro__title">Fo Guang Shan Genève</p>
    <p class="door-intro__title-zh">佛光山日內瓦道場</p>
    <p class="door-intro__subtitle">Cliquez pour ouvrir la porte et commencer la visite<br />點擊開門，開始互動導覽</p>
    <button class="door-cta" id="door-cta">Entrer 點擊進入</button>
  </div>
</div>

<!-- 場景舞台：兩層互相交叉淡出淡入 -->
<div class="scene-viewport">
  <div class="scene-stage" id="stage-a" hidden></div>
  <div class="scene-stage" id="stage-b" hidden></div>
</div>

<!-- 側邊 Sommaire -->
<button id="sommaire-toggle" aria-label="Ouvrir le sommaire de la visite">☰ Sommaire</button>
<button id="back-btn" aria-label="Précédent" hidden>← Précédent</button>
<button id="lang-toggle" aria-label="Changer de langue : français / English / 中文">EN</button>
<div id="sommaire-slot"></div>

<!-- 資訊卡掛載點 -->
<div id="info-panel-slot"></div>

<!-- 音檔播放器（沿用 v1 結構） -->
<div class="audio-dock" id="audio-dock" hidden aria-label="Lecteur audio">
  <audio id="audio-element" preload="none"></audio>
  <div class="audio-dock-inner">
    <div class="audio-dock-info">
      <span class="audio-dock-eyebrow" id="audio-dock-eyebrow"></span>
      <span class="audio-dock-title" id="audio-dock-title">Aucune fiche sélectionnée</span>
    </div>
    <div class="audio-dock-controls">
      <button class="icon-btn" id="audio-prev-btn" aria-label="Précédent">⏮</button>
      <button class="icon-btn" id="audio-replay-btn" aria-label="Revenir au début">⟲</button>
      <button class="icon-btn audio-play-btn" id="audio-play-btn" aria-label="Lecture">▶</button>
      <button class="icon-btn" id="audio-next-btn" aria-label="Suivant">⏭</button>
    </div>
    <div class="audio-dock-progress">
      <span class="audio-time" id="audio-current-time">0:00</span>
      <input type="range" id="audio-seek" class="audio-seek" min="0" max="100" value="0" step="1" aria-label="Avancement" />
      <span class="audio-time" id="audio-duration">0:00</span>
    </div>
    <div class="audio-dock-extra">
      <label class="audio-volume-label" for="audio-volume">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 9v6h4l5 5V4L8 9H4Z" fill="currentColor"/></svg>
        <input type="range" id="audio-volume" min="0" max="100" value="100" aria-label="Volume" />
      </label>
      <label class="audio-speed-label" for="audio-speed">Vitesse
        <select id="audio-speed" aria-label="Vitesse de lecture">
          <option value="0.75">0.75×</option>
          <option value="1" selected>1×</option>
          <option value="1.25">1.25×</option>
          <option value="1.5">1.5×</option>
        </select>
      </label>
      <button class="icon-btn audio-close-btn" id="audio-close-btn" aria-label="Fermer le lecteur">&times;</button>
    </div>
  </div>
</div>

<!-- 圖片放大 Modal（沿用 v1 結構） -->
<div class="image-modal" id="image-modal" hidden>
  <div class="image-modal-backdrop" id="image-modal-backdrop"></div>
  <div class="image-modal-panel" role="dialog" aria-modal="true" aria-label="Image agrandie">
    <button class="icon-btn image-modal-close" id="image-modal-close" aria-label="Fermer">&times;</button>
    <img id="image-modal-img" alt="" />
  </div>
</div>

<script src="data.js"></script>
<script src="scenes.js"></script>
<script src="app.js"></script>
</body>
</html>
