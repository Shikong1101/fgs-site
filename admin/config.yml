backend:
  name: github
  repo: shikong1101/fgs-site   # ← 改成實際的 GitHub 帳號/repo 名稱
  branch: main
  base_url: https://fragrant-truth-4410.renweizhang23.workers.dev   # ← 部署好 OAuth 代理伺服器後，把網址貼在這裡
  auth_endpoint: auth

# 每次存檔前，Decap 會先跳出「這則變更的內容 vs 原本內容」給你確認，
# 避免手滑存錯、或忘記自己改了什麼。
publish_mode: editorial_workflow

media_folder: "images"   # 上傳圖片時，檔案會被放進這個資料夾
public_folder: "images"  # 網頁上圖片路徑的對應寫法

locale: "zh_Hant"

collections:
  - name: "tour_data"
    label: "道場導覽網站內容"
    files:
      - file: "data/tour-data.json"
        label: "全部內容（道場資訊 + 16 個導覽項目）"
        name: "tour_data"
        fields:
          - label: "道場基本資訊"
            name: "templeInfo"
            widget: "object"
            fields:
              - { label: "道場名稱", name: "name", widget: "string" }
              - { label: "首頁標語（一句話）", name: "tagline", widget: "string" }
              - { label: "首頁簡介段落", name: "intro", widget: "text" }
              - label: "怎麼使用這個導覽（首頁步驟說明）"
                name: "howToUse"
                widget: "list"
              - label: "開放時間 / 參觀方式說明"
                name: "openingInfo"
                widget: "list"
              - label: "注意事項"
                name: "notices"
                widget: "list"
              - label: "聯絡資訊"
                name: "contact"
                widget: "object"
                fields:
                  - { label: "地址", name: "address", widget: "string" }
                  - { label: "電話", name: "phone", widget: "string" }
                  - { label: "Email", name: "email", widget: "string" }
                  - { label: "官方網站", name: "website", widget: "string" }

          - label: "分區列表（側邊選單分類，通常不用改）"
            name: "areas"
            widget: "list"
            hint: "這是導覽項目分類用的區域名稱，改這裡不會自動搬動下面每個項目的所屬分區，要小心。"

          - label: "16 個導覽項目"
            name: "tourItems"
            widget: "list"
            summary: "{{fields.order}}. {{fields.title}}"
            fields:
              - { label: "編號（例如 1-1，不要改，除非確定知道在做什麼）", name: "id", widget: "string" }
              - { label: "顯示順序（數字，越小越前面）", name: "order", widget: "number", value_type: "int" }
              - { label: "標題", name: "title", widget: "string" }
              - label: "類別"
                name: "category"
                widget: "select"
                options: ["Statue", "Symbole", "Bodhisattva", "Enseignement", "Maître", "Instrument rituel", "Vêtement rituel", "Bouddha"]
              - label: "所屬分區"
                name: "area"
                widget: "select"
                options: ["Entrée et parvis", "Grande salle du Bouddha", "Salle de Ksitigarbha"]
              - { label: "照片", name: "image", widget: "image" }
              - { label: "照片替代文字（給視障輔助工具讀的說明，不會顯示在畫面上）", name: "imageAlt", widget: "string" }
              - { label: "摘要（一到兩句話）", name: "shortDescription", widget: "text" }
              - label: "全文內容（每一段分開填，會自動照順序顯示）"
                name: "fullText"
                widget: "list"
              - { label: "語音檔案", name: "audio", widget: "file" }
              - { label: "語音長度（秒數，換新的音檔後記得更新，不然播放器一開始顯示的時間會不準）", name: "audioDuration", widget: "number", value_type: "int" }
